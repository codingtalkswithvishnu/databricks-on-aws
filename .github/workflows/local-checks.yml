name: Local healthcare contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # reviewed v6 reference
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # reviewed v6 reference
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error tools/check_local.py
  pipeline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_SUBMIT_ARGS: --driver-memory 2g pyspark-shell
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r tools/requirements-pipeline.txt
      - run: python tools/check_spark.py
      - run: python tools/check_pipeline.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pipeline-check-results
          path: pipeline-check-results.json
          if-no-files-found: warn
