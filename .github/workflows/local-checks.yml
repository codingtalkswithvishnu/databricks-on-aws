name: Local healthcare contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # reviewed v6 reference
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # reviewed v6 reference
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error tools/check_local.py
