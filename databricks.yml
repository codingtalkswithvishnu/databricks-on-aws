bundle:
  name: northstar-healthcare-learning
variables:
  cluster_id:
    description: Approved learning cluster with compatible Spark ML and MLflow
resources:
  jobs:
    healthcare_refresh:
      name: northstar-healthcare-learning
      tasks:
        - task_key: ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./01-lakehouse/01_ingest.py
        - task_key: clean
          depends_on:
            - task_key: ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./01-lakehouse/02_clean.py
        - task_key: report
          depends_on:
            - task_key: clean
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./02-analytics/03_report.py
        - task_key: predict
          depends_on:
            - task_key: report
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./03-prediction/04_train_score.py
targets:
  dev:
    default: true
    mode: development
sync:
  include:
    - shared/**
    - sample-data/**
    - 00-start-here/**
